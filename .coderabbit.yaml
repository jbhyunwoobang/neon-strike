# CodeRabbit configuration — https://github.com/coderabbitai
# Active once the CodeRabbit GitHub App is installed on this repository
# (github.com/apps/coderabbitai → Install → select this repo). It then reviews
# every pull request against the rules below.
#
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: assertive          # thorough, opinionated reviews
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Auto-review every PR to main/dev.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - dev

  # Keep noise down: skip generated / vendored / build output.
  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/*.min.js"
    - "!client/package-lock.json"
    - "!server/package-lock.json"

  # Domain-specific guidance so reviews understand this codebase.
  path_instructions:
    - path: "client/src/engine/**"
      instructions: >
        This is the imperative Three.js game engine. Flag per-frame allocations
        in update()/render loops (new Vector3/Color/Material inside hot paths),
        undisposed geometries/materials/textures (memory leaks), and any React
        imports (the engine must stay framework-free — it talks to the UI only
        through the Zustand store). Verify raycasts happen after matrices are
        current.
    - path: "client/src/ui/**"
      instructions: >
        React + TypeScript UI. Enforce the ui-ux-pro-max checklist: cursor-pointer
        on interactive elements, 150-300ms transitions, visible :focus-visible
        states, prefers-reduced-motion fallbacks, SVG icons (no emoji), and no
        mixing of CSS shorthand + longhand in inline styles (React warns).
    - path: "server/src/**"
      instructions: >
        Authoritative Socket.IO server. Validate and clamp all client-supplied
        payloads. Ensure room/socket cleanup on disconnect (no leaked rooms or
        intervals). Keep the network contract in sync with client/src/shared/protocol.ts.

  # Static analysis tools CodeRabbit should run.
  tools:
    eslint:
      enabled: true
    biome:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
