# Render Blueprint — deploys the authoritative NEON STRIKE server.
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: neon-strike-server
    runtime: node
    plan: free                     # free tier sleeps after ~15 min idle (cold start ~50s)
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: CLIENT_ORIGIN
        value: "*"                 # tighten to your Vercel URL for production
