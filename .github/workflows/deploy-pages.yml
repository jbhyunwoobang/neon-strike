name: Deploy client to GitHub Pages

# Publishes the client bundle to GitHub Pages on every push to main, giving an
# instant public link (single-player fully playable; multiplayer needs the
# separate Socket.IO server — see docs/DEPLOYMENT.md for Vercel + Render).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build client
        working-directory: client
        env:
          GH_PAGES: 'true'
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html   # SPA fallback for deep links
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
