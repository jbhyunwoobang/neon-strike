name: CI

# Sprint 001 A4 + Sprint 002 Z2/B2 — typecheck, the timing-table & systems
# test suite (feel canon: a failure here is an S2), and the build, every push/PR.

on:
  push:
    branches: [main, 'sprint/**', 's001/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: client
        run: npm install --no-workspaces --no-audit --no-fund
      - name: Typecheck
        working-directory: client
        run: npm run typecheck
      - name: Test (timing tables + systems core)
        working-directory: client
        run: npm test
      - name: Build (with size report)
        working-directory: client
        run: |
          npm run build
          echo "== bundle sizes =="
          du -sh dist
          ls -la dist/assets
